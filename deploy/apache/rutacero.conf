<VirtualHost *:80>
    ServerName finanzas.example.com
    Redirect permanent / https://finanzas.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName finanzas.example.com
    DocumentRoot /var/www/sitios/rutacero/current
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/finanzas.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/finanzas.example.com/privkey.pem
    <Directory /var/www/sitios/rutacero/current>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5080/api
    ProxyPassReverse /api http://127.0.0.1:5080/api
    ProxyPass /health http://127.0.0.1:5080/health
    ProxyPassReverse /health http://127.0.0.1:5080/health
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
</VirtualHost>
