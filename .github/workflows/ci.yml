name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/ruta-cero-web/package-lock.json
      - run: dotnet restore RutaCero.sln
      - run: dotnet build RutaCero.sln --configuration Release --no-restore
      - run: dotnet test RutaCero.sln --configuration Release --no-build
      - run: npm ci
        working-directory: src/frontend/ruta-cero-web
      - run: npm run build
        working-directory: src/frontend/ruta-cero-web
