<app-header></app-header><main class="page"><div class="heading"><div><span class="eyebrow">CONFIGURACIÓN</span><h1>Tipos de cambio</h1><p>Ruta Cero nunca convierte monedas sin una tasa explícita.</p></div></div><form class="panel budget-form" [formGroup]="form" (ngSubmit)="save()"><label>Desde<select formControlName="fromCurrency"><option value="USD">Dólares ($)</option><option value="HNL">Lempiras (L)</option></select></label><label>Hacia<select formControlName="toCurrency"><option value="HNL">Lempiras (L)</option><option value="USD">Dólares ($)</option></select></label><label>Tasa<input type="number" step="0.00000001" formControlName="rate"></label><label>Fecha<input type="date" formControlName="effectiveDate"></label><button>Registrar tasa</button></form><section class="panel movement-list">@for(x of rates();track x.id){<article><div><strong>1 {{x.fromCurrency}} = {{x.rate}} {{x.toCurrency}}</strong><small>{{x.effectiveDate}} · {{x.source}}</small></div></article>}@empty{<div class="empty"><h2>No hay tasas registradas</h2></div>}</section></main>
