<app-header></app-header><main class="page"><div class="heading"><h1>Planeación</h1></div>@if(notice()){<div class="success">{{notice()}}</div>}@if(error()){<div class="error">{{error()}}</div>}<form class="panel settings-form" [formGroup]="settings" (ngSubmit)="saveSettings()"><h2>Reserva y perfil</h2><label>Reserva fija<input type="number" formControlName="safetyReserveAmount"></label><label>Modo<select formControlName="safetyReserveMode"><option value="FixedAmount">Monto fijo</option><option value="EssentialExpenseDays">Días esenciales</option><option value="HighestOfBoth">Mayor de ambos</option></select></label><label>Días esenciales<input type="number" formControlName="minimumDaysOfEssentialExpenses"></label><label>Perfil<select formControlName="defaultRecommendationProfile"><option value="Conservative">Conservador</option><option value="Balanced">Balanceado</option><option value="Aggressive">Agresivo</option></select></label><label>Moneda base<select formControlName="baseCurrency"><option value="HNL">Lempiras (L)</option><option value="USD">Dólares ($)</option></select></label><label class="check"><input type="checkbox" formControlName="allowEstimatedBalancesInRecommendations"> Permitir saldos estimados en recomendaciones</label><button type="submit">Guardar configuración</button></form></main>
